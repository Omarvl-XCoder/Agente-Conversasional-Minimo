
services:
  fastapi_service:
    build: .
    container_name: agente_fastapi
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - API_KEY_GROQ=${API_KEY_GROQ}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}

  django-service:
    build: ./DJango
    ports:
      - "8001:8001"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./DJango/.env