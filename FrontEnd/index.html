<!DOCTYPE html>
<html lang="es" class="h-full antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente Conversacional</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%237c6cf6' d='M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            base: '#09090d',
            surface: '#131319',
            surfaceAlt: '#1a1a22',
            hairline: 'rgba(255,255,255,0.07)',
            accent: '#7c6cf6',
            accentSoft: 'rgba(124,108,246,0.14)',
            ink: '#e7e6ee',
            muted: '#8d8c9a',
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            sans: ['Inter', 'ui-sans-serif', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    #chat-container::-webkit-scrollbar { width: 8px; }
    #chat-container::-webkit-scrollbar-thumb { background: #232330; border-radius: 8px; }
    #chat-container::-webkit-scrollbar-track { background: transparent; }

    .grain-bg {
      background-image: radial-gradient(rgba(124,108,246,0.10) 1px, transparent 1px);
      background-size: 22px 22px;
      -webkit-mask-image: radial-gradient(ellipse 55% 50% at 50% 0%, #000 60%, transparent 100%);
              mask-image: radial-gradient(ellipse 55% 50% at 50% 0%, #000 60%, transparent 100%);
    }

    @keyframes bounce-dot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    .typing-dot { animation: bounce-dot 1.1s infinite ease-in-out; }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  </style>
</head>
<body class="flex h-full flex-col bg-base text-ink selection:bg-accent selection:text-white font-sans">

  <div class="fixed inset-0 -z-10 h-full w-full bg-base grain-bg"></div>

  <!-- Encabezado -->
  <header class="sticky top-0 z-30 border-b border-hairline bg-base/85 backdrop-blur-md">
    <div class="mx-auto flex h-16 max-w-4xl items-center justify-between px-4 sm:px-6">

      <div class="flex items-center gap-3">
        <!-- Ícono propio: chispa geométrica -->
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-accentSoft ring-1 ring-inset ring-accent/25">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
            <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"
                  fill="#7c6cf6" stroke="#a599f9" stroke-width="0.6" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="flex flex-col leading-none">
          <div class="flex items-center gap-2">
            <h1 class="font-mono text-[15px] font-semibold tracking-tight text-white">Agente Conversacional</h1>
            <span class="rounded-md bg-surfaceAlt px-1.5 py-0.5 text-[10px] font-mono text-muted ring-1 ring-inset ring-hairline">v1.0</span>
          </div>
          <div class="mt-1 flex items-center gap-1.5">
            <span class="relative flex h-1.5 w-1.5">
              <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-70"></span>
              <span class="relative inline-flex h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
            </span>
            <span class="text-[11px] text-muted">en línea</span>
          </div>
        </div>
      </div>

      <button
        id="new-chat-btn"
        type="button"
        class="inline-flex items-center gap-1.5 rounded-lg border border-hairline bg-surface px-3 py-1.5 text-xs font-medium text-ink/80 transition hover:border-accent/40 hover:text-white hover:bg-surfaceAlt active:scale-95 focus:outline-none focus:ring-2 focus:ring-accent/30"
      >
        <svg class="h-3.5 w-3.5 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Nuevo chat
      </button>

    </div>
  </header>

  <!-- Área de conversación -->
  <main id="chat-container" class="flex-1 overflow-y-auto px-4 py-6 sm:px-6">
    <div id="messages-list" class="mx-auto flex max-w-3xl flex-col gap-5"></div>
  </main>

  <!-- Barra de entrada -->
  <footer class="border-t border-hairline bg-base/90 p-4 backdrop-blur-xl">
    <div class="mx-auto max-w-3xl">
      <form id="chat-form" class="relative flex items-center">
        <input
          type="text"
          id="user-input"
          placeholder="Escribe un mensaje para el agente…"
          autocomplete="off"
          required
          class="w-full rounded-2xl border border-hairline bg-surface py-3.5 pl-4 pr-14 text-sm text-white placeholder:text-muted/70 shadow-inner focus:border-accent/60 focus:bg-surfaceAlt focus:outline-none focus:ring-2 focus:ring-accent/25 transition duration-150"
        />
        <button
          type="submit"
          id="send-btn"
          aria-label="Enviar mensaje"
          class="absolute right-2 flex h-9 w-9 items-center justify-center rounded-xl bg-accent text-white shadow-md shadow-accent/20 transition hover:bg-accent/85 active:scale-90 disabled:opacity-40 disabled:hover:bg-accent disabled:cursor-not-allowed"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>
  </footer>

  <script>
    const API_URL = "http://127.0.0.1:8000/chat";
    const historial = [];

    const chatContainer = document.getElementById("chat-container");
    const messagesList = document.getElementById("messages-list");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const newChatBtn = document.getElementById("new-chat-btn");

    function renderBubble(texto, rol) {
      const isUser = rol === "usuario";
      const item = document.createElement("div");

      item.className = `flex gap-3 text-sm transition-all duration-200 ${isUser ? "flex-row-reverse" : "flex-row"}`;

      const avatar = document.createElement("div");
      avatar.className = `flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-[11px] font-mono font-semibold ring-1 ${
        isUser
          ? "bg-accent text-white ring-accent/30"
          : "bg-surfaceAlt text-ink/80 ring-hairline"
      }`;
      avatar.textContent = isUser ? "Tú" : "AI";

      const bubble = document.createElement("div");
      bubble.className = `max-w-[80%] rounded-2xl px-4 py-2.5 leading-relaxed break-words text-[14px] ${
        isUser
          ? "bg-accent text-white font-medium rounded-tr-none shadow-sm shadow-accent/20"
          : "bg-surface text-ink border border-hairline rounded-tl-none shadow-md shadow-black/30"
      }`;
      bubble.textContent = texto;

      item.appendChild(avatar);
      item.appendChild(bubble);
      messagesList.appendChild(item);

      chatContainer.scrollTop = chatContainer.scrollHeight;
      return item;
    }

    function showTyping() {
      const item = document.createElement("div");
      item.id = "typing-indicator";
      item.className = "flex gap-3 text-sm";

      const avatar = document.createElement("div");
      avatar.className = "flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-surfaceAlt text-ink/80 ring-1 ring-hairline text-[11px] font-mono font-semibold";
      avatar.textContent = "AI";

      const bubble = document.createElement("div");
      bubble.className = "flex items-center gap-1.5 rounded-2xl rounded-tl-none border border-hairline bg-surface px-4 py-3 shadow-md shadow-black/30";
      bubble.innerHTML = `
        <span class="typing-dot h-1.5 w-1.5 rounded-full bg-accent"></span>
        <span class="typing-dot h-1.5 w-1.5 rounded-full bg-accent"></span>
        <span class="typing-dot h-1.5 w-1.5 rounded-full bg-accent"></span>
      `;

      item.appendChild(avatar);
      item.appendChild(bubble);
      messagesList.appendChild(item);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    function resetChat() {
      historial.length = 0;
      messagesList.innerHTML = "";
      renderBubble("¡Hola! ¿En qué puedo ayudarte hoy?", "asistente");
    }

    newChatBtn.addEventListener("click", resetChat);

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const mensaje = userInput.value.trim();
      if (!mensaje) return;

      renderBubble(mensaje, "usuario");
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje, historial })
        });

        hideTyping();

        if (res.ok) {
          const data = await res.json();
          renderBubble(data.respuesta, "asistente");
          historial.push({ rol: "usuario", contenido: mensaje });
          historial.push({ rol: "asistente", contenido: data.respuesta });
        } else {
          renderBubble(`Error ${res.status}: Problema al conectar.`, "asistente");
        }
      } catch {
        hideTyping();
        renderBubble("Error: No se pudo conectar con el servidor backend.", "asistente");
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    });

    resetChat();
  </script>
</body>
</html>
